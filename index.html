<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income & Loss Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #FBFAF6;
    color: #171614;
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
  .masthead {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid #171614; padding-bottom: 18px; margin-bottom: 36px;
    flex-wrap: wrap; gap: 12px;
  }
  h1 { font-family: 'Source Serif 4', serif; font-size: 30px; font-weight: 600; margin: 0; }
  .sub { margin: 6px 0 0; color: #6B6558; font-size: 14px; }
  .net-label { font-size: 12px; color: #6B6558; margin-bottom: 2px; text-align: right; }
  .net-value { font-size: 32px; font-weight: 500; text-align: right; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #D9D4C8; margin-bottom: 40px; border: 1px solid #D9D4C8; }
  .summary div.cell { background: #fff; padding: 18px 20px; }
  .cell-label { font-size: 12px; color: #6B6558; margin-bottom: 6px; }
  .cell-value { font-size: 22px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 32px; padding-bottom: 28px; border-bottom: 1px solid #D9D4C8; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #6B6558; }
  input, select {
    font-family: inherit; font-size: 14px; border: 1px solid #D9D4C8;
    background: #fff; padding: 8px 10px; border-radius: 2px; color: #171614;
  }
  input:focus, select:focus { outline: 2px solid #1F6F52; outline-offset: 1px; border-color: #1F6F52; }
  button {
    background: #171614; color: #FBFAF6; border: none; padding: 9px 18px;
    font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 2px; height: 37px;
  }
  button:hover { background: #2c2a26; }
  .del-btn {
    background: none; border: none; color: #9B3B3B; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0; opacity: 0; transition: opacity .15s;
  }
  .row:hover .del-btn { opacity: 1; }
  .table-head, .row {
    display: grid; grid-template-columns: 90px 1fr 110px 130px 24px; gap: 12px; align-items: center;
  }
  .table-head { font-size: 12px; color: #6B6558; border-bottom: 1px solid #171614; padding-bottom: 8px; margin-bottom: 4px; }
  .row { padding: 10px 0; border-bottom: 1px solid #EAE6DC; font-size: 14px; }
  .right { text-align: right; }
  .empty { padding: 24px 0; color: #6B6558; font-size: 14px; }
  .footnote { margin-top: 40px; font-size: 12px; color: #A39D8E; }
  @media (max-width: 480px) {
    .table-head, .row { grid-template-columns: 70px 1fr 90px 24px; }
    .table-head span:nth-child(4), .row .balance { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1 id="bizName" contenteditable="true" spellcheck="false"></h1>
      <p class="sub">Income and loss ledger</p>
    </div>
    <div>
      <div class="net-label">Net position</div>
      <div class="net-value num" id="netValue">$0</div>
    </div>
  </div>

  <div class="summary">
    <div class="cell">
      <div class="cell-label">Total income</div>
      <div class="cell-value num" id="totalIncome" style="color:#1F6F52;">$0</div>
    </div>
    <div class="cell">
      <div class="cell-label">Total losses</div>
      <div class="cell-value num" id="totalLoss" style="color:#9B3B3B;">$0</div>
    </div>
  </div>

  <form id="entryForm">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <div class="field" style="flex:1; min-width:160px;">
      <label for="desc">Description</label>
      <input type="text" id="desc" placeholder="e.g. Customer invoice" required>
    </div>
    <div class="field">
      <label for="type">Type</label>
      <select id="type">
        <option value="income">Income</option>
        <option value="loss">Loss</option>
      </select>
    </div>
    <div class="field" style="width:130px;">
      <label for="amount">Amount</label>
      <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
    </div>
    <button type="submit">Add entry</button>
  </form>

  <div class="table-head">
    <span>Date</span><span>Description</span><span class="right">Amount</span><span class="right">Balance</span><span></span>
  </div>
  <div id="ledger"></div>

  <p class="footnote">Your data is saved in this browser only (localStorage) — it won't sync across devices, but it'll be here next time you visit this page.</p>
</div>

<script>
  const STORAGE_KEY = "ledger_entries_v1";
  const NAME_KEY = "ledger_business_name_v1";

  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
  }
  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }
  function loadName() {
    return localStorage.getItem(NAME_KEY) || "My Startup";
  }
  function saveName(name) {
    localStorage.setItem(NAME_KEY, name);
  }

  const money = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const monthDay = (iso) => {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  };

  let entries = loadEntries();

  const bizNameEl = document.getElementById("bizName");
  bizNameEl.textContent = loadName();
  bizNameEl.addEventListener("blur", () => {
    const val = bizNameEl.textContent.trim() || "My Startup";
    bizNameEl.textContent = val;
    saveName(val);
  });
  bizNameEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); bizNameEl.blur(); }
  });

  function render() {
    const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
    let income = 0, loss = 0, running = 0;
    const balances = {};
    sorted.forEach(e => {
      if (e.type === "income") { income += e.amount; running += e.amount; }
      else { loss += e.amount; running -= e.amount; }
      balances[e.id] = running;
    });
    const net = income - loss;

    document.getElementById("totalIncome").textContent = money(income);
    document.getElementById("totalLoss").textContent = money(loss);
    const netEl = document.getElementById("netValue");
    netEl.textContent = (net >= 0 ? "" : "−") + money(Math.abs(net));
    netEl.style.color = net >= 0 ? "#1F6F52" : "#9B3B3B";

    const ledger = document.getElementById("ledger");
    ledger.innerHTML = "";
    if (sorted.length === 0) {
      ledger.innerHTML = '<div class="empty">No entries yet. Add your first income or loss above.</div>';
      return;
    }
    sorted.forEach(e => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="num" style="color:#6B6558; font-size:13px;">${monthDay(e.date)}</div>
        <div>${escapeHtml(e.desc)}</div>
        <div class="num right" style="color:${e.type === "income" ? "#1F6F52" : "#9B3B3B"};">
          ${e.type === "income" ? "+" : "−"}${money(e.amount)}
        </div>
        <div class="num right balance" style="color:#6B6558;">${money(balances[e.id])}</div>
        <button class="del-btn" title="Remove entry" data-id="${e.id}">×</button>
      `;
      ledger.appendChild(row);
    });
    ledger.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        entries = entries.filter(e => e.id !== Number(btn.dataset.id));
        saveEntries(entries);
        render();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("entryForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const date = document.getElementById("date").value;
    const desc = document.getElementById("desc").value.trim();
    const type = document.getElementById("type").value;
    const amount = parseFloat(document.getElementById("amount").value);
    if (!date || !desc || isNaN(amount) || amount <= 0) return;
    entries.push({ id: Date.now(), date, desc, type, amount });
    saveEntries(entries);
    e.target.reset();
    render();
  });

  render();
</script>
</body>
</html>
